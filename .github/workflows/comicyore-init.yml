name: ComicYore - Init Issue + Generate Manifest

on:
  workflow_dispatch:
    inputs:
      issueDir:
        description: "Issue folder under issues/, ex. issue-001"
        required: true
      publisher:
        description: "publisher slug (lowercase and no spaces ex. comic-publisher)"
        required: true
      comic:
        description: "comic slug (lowercase and no spaces ex. my-awesome-comic)"
        required: true
      issueSlug:
        description: "issue slug (ex. lowercase and no spaces comic-name-001)"
        required: true
      title:
        description: "issue title (ex. My Awesome Comic #1)"
        required: true
  push:
    paths:
      - "issues/**/published/*.jpg"
      - "issues/**/published/*.jpeg"
      - "issues/**/published/*.png"
      - "issues/**/published/*.webp"
      - "issues/**/published/dialogue.txt"
      - "issues/**/published/layout.json"
      - "tools/**"
      - ".github/workflows/comicyore-init.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure tools executable
        run: chmod +x tools/init-issue.sh

      - name: Init issue structure (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          ./tools/init-issue.sh \
            "${{ inputs.issueDir }}" \
            "${{ inputs.publisher }}" \
            "${{ inputs.comic }}" \
            "${{ inputs.issueSlug }}" \
            "${{ inputs.title }}"

      - name: Generate manifests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/gen-manifest.mjs --issueDir="${{ inputs.issueDir }}"
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
              | awk -F/ '/^issues\/[^/]+\/published\//{print $2}' \
              | sort -u)

            if [ -z "$CHANGED" ]; then
              CHANGED=$(git show --name-only --pretty="" "${{ github.sha }}" \
                | awk -F/ '/^issues\/[^/]+\/published\//{print $2}' \
                | sort -u)
            fi

            for d in $CHANGED; do
              if [ -f "issues/$d/published/manifest.json" ]; then
                node tools/gen-manifest.mjs --issueDir="$d"
              fi
            done
          fi

      - name: Commit changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Stage without relying on ** globstar
            git add -A issues tools .github || true

            # Commit only if something is staged
            if git diff --cached --quiet; then
              echo "No staged changes to commit."
              exit 0
            fi

            git commit -m "Update ComicYore manifests"
            git push
          else
            echo "No changes to commit."
          fi
